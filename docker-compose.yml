# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
#   Build images: docker compose build
#      Start app: docker compose up -d
#       Stop all: docker compose down
#
# 首次使用前请先复制 .env.example 为 .env 并填写必填项：
#   cp .env.example .env
# 缺少 ADMIN_SETUP_SECRET 或 REDIS_PASSWORD 时 compose 会报错退出，不会用弱默认值部署。

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  # 管理员引导密钥（必填，无默认值，用于首次创建管理员账号）
  ADMIN_SETUP_SECRET: "${ADMIN_SETUP_SECRET:?请先在 .env 中设置 ADMIN_SETUP_SECRET}"
  # Redis 访问密码（必填，无默认值）
  REDIS_PASSWORD: "${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data

  app:
    image: chatserverforswift:latest
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      <<: *shared_environment
      REDIS_HOST: redis
      # 只挂载数据子目录，避免遮蔽镜像内 /app 下的可执行文件
      DB_PATH: /app/data/chat_server_db.sqlite
    ports:
      - '8080:8080'
    volumes:
      - ./data:/app/data
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]

volumes:
  redis-data:
